<body>
  <div class="page-header align-items-start min-vh-100" style="background-image: url('Imagenes/estrellas.png');"
    loading="lazy">
    <span class="mask bg-gradient-dark opacity-6"></span>
    <div id="layoutAuthentication">
      <div id="layoutAuthentication_content">
        <main>
          <div class="container">
            <div class="row justify-content-center">
              <div class="col-lg-7">
                <div class="card shadow-lg">
                  <div class="card-header">
                    <h3 class="text-center font-weight-light my-4">Crear Cuenta</h3>
                  </div>
                  <div class="card-body">
                    <form action="registro.php" method="post">
                      <div class="row mb-3">
                        <!--div class="col-md-6">
                          <div class="form-floating">
                            <input class="form-control" id="inputUsuario" type="text" placeholder="Name" name="inputUsuario" />
                            <label for="inputUsuario">Id</label>
                          </div>
                        </div-->
                        <div class="col-md-12">
                          <div class="form-floating">
                            <input class="form-control" id="inputFirstName" type="text" placeholder="Enter your first name" name="inputFirstName" />
                            <label for="inputFirstName">Nombre</label>
                          </div>
                        </div>
                      </div>
                      <div class="form-floating mb-3">
                        <input class="form-control" id="correo" type="mail" placeholder="name@example.com" name="correo" />
                        <label for="correo">Correo Electrónico</label>
                      </div>
                      <div class="row mb-3">
                        <div class="col-md-6">
                          <div class="form-floating">
                            <input class="form-control" id="inputPassword" type="password" placeholder="Create a password" name="inputPassword" />
                            <label for="inputPassword">Contraseña</label>
                          </div>
                        </div>
                        <div class="col-md-6">
                          <div class="form-floating">
                            <input class="form-control" id="inputPasswordConfirm" type="password" placeholder="Confirm password" name="inputPasswordConfirm" />
                            <label for="inputPasswordConfirm">Confirmar Contraseña</label>
                          </div>
                        </div>
                      </div>
                      <div class="mt-4 mb-0">
                        <div class="d-grid">
                          <input class="btn btn-primary" type="submit" value="Registrarse">
                        </div>
                      </div>
                    </form>
                  </div>
                  <div class="card-footer text-center py-3">
                    <div class="small">
                      <a href="login.html">¿Ya tienes una cuenta? Inicia sesión</a>
                    </div>

                </div>
